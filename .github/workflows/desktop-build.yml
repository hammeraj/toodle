name: Desktop Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: _build_windows/prod/*.exe
          # Pinned to an arm64 image rather than the rolling "macos-latest"
          # label -- Toodle only ships an Apple Silicon build, so this must
          # stay an arm64 runner regardless of what "latest" points at.
          # (macos-15 is GitHub's arm64 image; the "-large" suffix is the
          # Intel variant.) The "Verify arm64 build" step below asserts the
          # resulting binary's architecture rather than trusting the label.
          - os: macos-15
            artifact_glob: _build/prod/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: prod
      # Pinned rather than "latest" so the bundle step below stays
      # reproducible and cacheable. See Toodle.Llm.OllamaServer for how
      # this gets run, and mix.exs's bundle_ollama/1 for how it's embedded.
      OLLAMA_VERSION: v0.33.0
      OLLAMA_BUNDLE_MODEL: qwen2.5:1.5b
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0"
          elixir-version: "1.20.3"

      # Sets up cl.exe/link.exe/nmake on PATH for the rest of this job —
      # needed to compile exqlite's SQLite NIF (Makefile.win).
      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # exqlite's Makefile.win computes this itself via `erl -eval ...`, but
      # that invocation breaks under nmake's argument quoting on Windows.
      # Pre-setting the env var makes it skip straight to compiling.
      - name: Compute ERTS_INCLUDE_PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          root_dir=$(erl -noshell -eval 'io:format("~ts", [code:root_dir()]), halt().')
          vsn=$(erl -noshell -eval 'io:format("~ts", [erlang:system_info(version)]), halt().')
          echo "ERTS_INCLUDE_PATH=$root_dir/erts-$vsn/include" >> "$GITHUB_ENV"

      # Chocolatey registers makensis.exe's directory via the registry, but
      # GitHub Actions doesn't re-read that for steps already queued in this
      # job — later steps (mix release, which shells out to `makensis`)
      # won't find it on PATH unless we append it to GITHUB_PATH ourselves.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install ImageMagick (Windows)
        if: runner.os == 'Windows'
        run: choco install imagemagick -y --no-progress --params "/InstallLegacyUtilities"

      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick

      # Bundled Ollama runtime + model that Toodle.Llm.OllamaServer spawns
      # at app launch (macOS only for now — see mix.exs's bundle_ollama/1).
      # Cached across builds since it's ~150MB (runtime) + ~1GB (model)
      # neither of which change unless OLLAMA_VERSION/OLLAMA_BUNDLE_MODEL
      # above are bumped; re-fetching and re-pulling that on every push
      # would be slow and wasteful.
      - name: Cache bundled Ollama runtime + model (macOS)
        if: runner.os == 'macOS'
        id: ollama-bundle-cache
        uses: actions/cache@v4
        with:
          path: ollama-bundle
          key: ollama-bundle-${{ env.OLLAMA_VERSION }}-${{ env.OLLAMA_BUNDLE_MODEL }}-v1

      - name: Fetch bundled Ollama runtime + model (macOS)
        if: runner.os == 'macOS' && steps.ollama-bundle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          curl -sL -o ollama.tgz \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-darwin.tgz"
          mkdir -p ollama-bundle/bin
          tar xzf ollama.tgz -C ollama-bundle/bin

          # Ollama's macOS tarball bundles GPU/CPU backend variants for every
          # x86_64 microarchitecture (Toodle ships arm64-only, verified
          # elsewhere in this job) and an Apple MLX runtime that GGUF models
          # like the one bundled here don't use — confirmed hands-on that
          # generation still works via the Metal backend with both removed,
          # and it cuts this from ~485MB to ~100MB on disk.
          rm -f ollama-bundle/bin/libggml-cpu-*.so
          rm -rf ollama-bundle/bin/mlx_metal_v3 ollama-bundle/bin/mlx_metal_v4

          # Populate the models dir by actually pulling through a real
          # `ollama serve` — its content-addressed blob store isn't a plain
          # GGUF file, so this is the only supported way to stage it for
          # fully offline bundling later.
          mkdir -p ollama-bundle/models
          OLLAMA_MODELS="$PWD/ollama-bundle/models" OLLAMA_HOST=127.0.0.1:11535 \
            ./ollama-bundle/bin/ollama serve &
          echo $! > ollama-serve.pid

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11535/api/version >/dev/null && break
            sleep 1
          done

          OLLAMA_HOST=127.0.0.1:11535 ./ollama-bundle/bin/ollama pull "$OLLAMA_BUNDLE_MODEL"

          kill "$(cat ollama-serve.pid)"
          du -sh ollama-bundle

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Build assets
        run: mix assets.deploy

      - name: Build release + installer
        env:
          TOODLE_OLLAMA_BUNDLE_DIR: ${{ runner.os == 'macOS' && format('{0}/ollama-bundle', github.workspace) || '' }}
        run: mix release --overwrite

      - name: Verify arm64 build (macOS)
        if: runner.os == 'macOS'
        run: |
          # Desktop.Deployment names the emulator binary after the app
          # (Toodle.smp), not the erts-default beam.smp.
          bin=$(ls _build/prod/Toodle.app/Contents/Resources/erts-*/bin/*.smp)
          arch=$(lipo -archs "$bin")
          echo "$bin architecture(s): $arch"
          if [ "$arch" != "arm64" ]; then
            echo "::error::Expected an arm64-only build, got: $arch" >&2
            exit 1
          fi

      # GitHub Releases hard-caps a single asset at 2GiB (2147483648 bytes)
      # — the release job below would fail to publish past that. Bundling
      # the Ollama runtime + model gets this well over the previous ~30MB
      # baseline, so check it explicitly rather than finding out at publish
      # time; 1900MiB leaves headroom for the app itself to grow.
      - name: Check dmg size budget (macOS)
        if: runner.os == 'macOS'
        run: |
          max=$((1900 * 1024 * 1024))
          dmg=$(ls _build/prod/*.dmg)
          size=$(stat -f%z "$dmg")
          echo "$dmg: $((size / 1024 / 1024)) MiB (budget: $((max / 1024 / 1024)) MiB)"
          if [ "$size" -gt "$max" ]; then
            echo "::error::$dmg is over the size budget — GitHub Releases rejects assets over 2GiB" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: toodle-${{ runner.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    # Only pushes to main touch the public release — workflow_dispatch runs
    # (used for testing from other branches) still build and upload CI
    # artifacts above, but shouldn't overwrite it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # Permanent, never-overwritten release for every build -- a rollback
      # target if a "latest" build turns out to be broken (one shipped for a
      # while with a macOS launch crash that CI's "did a .dmg get produced"
      # check couldn't catch). Kept as a prerelease so it doesn't compete
      # with "Publish latest release" below for the repo's "Latest release"
      # badge; that rolling pointer is what Toodle.Updater actually reads.
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SHORT_SHA }}
          name: Build ${{ env.SHORT_SHA }}
          body: "Commit: ${{ github.sha }}"
          prerelease: true
          files: artifacts/**/*

      # No version numbering, so this republishes a single rolling "latest"
      # release on every push to main rather than piling up one release per
      # build. Since the tag never changes, the commit SHA in the release
      # body is the only signal Toodle.Updater has to tell whether a given
      # build is actually newer than what's installed.
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Commit: ${{ github.sha }}"
          prerelease: true
          files: artifacts/**/*
