name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# See desktop-build.yml's concurrency block -- same duplicate-delivery issue.
# This job doesn't publish anything, so canceling a stale/duplicate run in
# favor of the new one is safe (and saves CI time) rather than just queuing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0"
          elixir-version: "1.20.3"

      # Desktop packaging deps (desktop, exqlite git fork, etc.) are only
      # declared on Windows/macOS — this runner is neither, so it gets the
      # plain hex deps declared for every other platform, same as WSL dev.
      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
